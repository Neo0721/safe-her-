<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SafeHer</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #fafafc; color: #1f2937;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    main { max-width: 26rem; margin: 0 auto; padding: 2rem 1.25rem; box-sizing: border-box; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    p { line-height: 1.5; }
    .small { font-size: .8rem; color: #6b7280; word-break: break-all; }
    button {
      min-height: 3rem; width: 100%; border: 0; border-radius: 1rem; margin-top: .5rem;
      background: #7c3aed; color: #fff; font-size: 1rem; font-weight: 600;
    }
    .sos {
      display: flex; align-items: center; justify-content: center; min-height: 3rem; margin-top: 1rem;
      border-radius: 1rem; background: #ef4444; color: #fff; font-weight: 700; text-decoration: none;
    }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f8fafc; } .small { color: #94a3b8; } }
  </style>
</head>
<body>
  <main>
    <h1>Can&rsquo;t reach SafeHer</h1>
    <p>Check that your phone is online and that the SafeHer server is running.</p>
    <p id="target" class="small">__TARGET_TEXT__</p>
    <a id="sos" class="sos" href="tel:__EMERGENCY_NUMBER__">Call __EMERGENCY_NUMBER__ now</a>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    var url = __SERVER_URL_JSON__;
    document.getElementById('retry').addEventListener('click', function () {
      if (url) window.location.href = url; else window.location.reload();
    });
  </script>
</body>
</html>
