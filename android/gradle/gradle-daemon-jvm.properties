# Capacitor 8 / AGP 8.13 build with JDK 21. Gradle 8.14 cannot run on the JDK 25 that may be the
# system default, so pin the daemon JVM. Gradle finds a local JDK 21 (e.g. Android Studio's
# bundled JBR) or downloads one through the foojay resolver configured in settings.gradle.
toolchainVersion=21
