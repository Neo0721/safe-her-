<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SafeHer</title>
  <link rel="stylesheet" href="shell.css" />
  <script src="server-url.js"></script>
</head>
<body>
  <main>
    <h1>Can&rsquo;t reach SafeHer</h1>
    <p>Check that your phone is online and that the SafeHer server is running.</p>
    <p id="target" class="small"></p>
    <a id="sos" class="sos" href="tel:112">Call emergency number</a>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    var url = window.SAFEHER_SERVER_URL || '';
    var num = window.SAFEHER_EMERGENCY_NUMBER || '112';
    var sos = document.getElementById('sos'); sos.href = 'tel:' + num; sos.textContent = 'Call ' + num + ' now';
    document.getElementById('target').textContent = url ? 'Server: ' + url : '';
    document.getElementById('retry').addEventListener('click', function () {
      if (url) window.location.href = url; else window.location.reload();
    });
  </script>
</body>
</html>
