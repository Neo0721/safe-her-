<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SafeHer</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #fafafc; color: #1f2937;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    main { max-width: 26rem; margin: 0 auto; padding: 2rem 1.25rem; box-sizing: border-box; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    p { line-height: 1.5; }
    code { background: rgba(124, 58, 237, .12); padding: .1rem .35rem; border-radius: .35rem; word-break: break-all; }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f8fafc; } }
  </style>
</head>
<body>
  <main>
    <h1>SafeHer is not configured</h1>
    <p>This build has no server address. Set <code>NEXT_PUBLIC_API_BASE_URL</code> in <code>.env.local</code>
       to the address of your SafeHer server, then run <code>npx cap sync android</code> and rebuild.</p>
  </main>
</body>
</html>
